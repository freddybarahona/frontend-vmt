<header class="sticky top-0 z-50 bg-white border-b border-slate-200 shadow-sm">

  <div class="px-6 py-4 flex items-center justify-between">

    <!-- IZQUIERDA -->
    <div class="flex items-center gap-4">

      <div
        (click)="refreshtoDashboard()"
        class="cursor-pointer">

        <h1
          class="text-3xl font-bold bg-gradient-to-r from-blue-600 to-slate-700 bg-clip-text text-transparent hover:opacity-80 transition">
          EduSystem
        </h1>

        <p class="text-xs text-slate-500">
          Academic Management Platform
        </p>

      </div>

      @if(isAdmin()){
        <button
          routerLink="/administrator/dashboard-bi"
          class="flex items-center gap-2 rounded-xl bg-blue-600 px-4 py-2 text-white font-medium shadow-md transition-all hover:bg-blue-700 hover:shadow-lg">

          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-5">

            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M7.5 14.25v2.25m3-4.5v4.5m3-6.75v6.75m3-9v9M6 20.25h12A2.25 2.25 0 0 0 20.25 18V6A2.25 2.25 0 0 0 18 3.75H6A2.25 2.25 0 0 0 3.75 6v12A2.25 2.25 0 0 0 6 20.25Z" />

          </svg>

          Dashboard BI

        </button>
      }

    </div>

    <!-- DERECHA -->
    <div (click)="toggleMenu()" class="relative flex items-center gap-3 cursor-pointer rounded-xl px-3 py-2 hover:bg-slate-100 transition">
      <div class="hidden md:block text-right">
        <p class="text-xs text-slate-500">
          Usuario activo
        </p>
      </div>
      <!-- MENU PRINCIPAL -->
@if(isMenuOpen()){
  <div
    class="absolute right-0 top-16 w-56 overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-xl">

    <!-- Mi perfil -->
    <div
      (click)="toggleProfile(); $event.stopPropagation()" class="flex items-center gap-3 px-4 py-3 text-slate-600 cursor-pointer transition-all hover:bg-slate-50 hover:text-slate-800">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
      </svg>
      <span class="font-medium">
        Mi perfil
      </span>

    </div>

    <div class="border-t border-slate-200"></div>

      <!-- Cerrar sesión -->
      <div (click)="logout(); $event.stopPropagation()" class="flex items-center gap-3 px-4 py-3 text-red-500 cursor-pointer transition-all duration-200 hover:bg-red-500 hover:text-white">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15M12 9l-3 3m0 0 3 3m-3-3h12.75" />
        </svg>
        <span class="font-medium">
          Cerrar sesión
        </span>
      </div>
    </div>

        


        <!-- MENU DEL PERFIL COMPLETO -->
        @if(isProfileOpen()){
          <div
            (click)="$event.stopPropagation()"
            class="cursor-default absolute right-60 top-16 w-80 overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-2xl">

            <!-- CABECERA -->
            <div class="bg-gradient-to-r from-blue-600 to-slate-700 px-6 py-6">

              <div class="flex flex-col items-center">

                <div
                  class="flex h-20 w-20 items-center justify-center rounded-full border border-white/30 bg-white/20 backdrop-blur">

                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="1.5"
                    stroke="currentColor"
                    class="size-10 text-white">

                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z"/>

                  </svg>

                </div>

                <h3 class="mt-4 text-xl font-bold text-white">
                  {{ userInfo[0]?.name }}
                </h3>

                <p class="text-sm text-blue-100">
                  Usuario activo
                </p>

              </div>

            </div>

            <!-- CONTENIDO -->
            <div class="space-y-5 p-6">

              <div>
                <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">
                  Correo electrónico
                </p>

                <p class="mt-1 break-words text-slate-700 font-medium">
                  {{ userInfo[0]?.email }}
                </p>
              </div>

              <div>
                <p class="text-xs font-semibold uppercase tracking-wider text-slate-400">
                  Identificación
                </p>

                <p class="mt-1 text-slate-700 font-medium">
                  {{ userInfo[0]?.identificacion }}
                </p>
              </div>

            </div>

          </div>
        }
      }
      <div
        class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center border border-slate-200">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6 text-slate-600">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17.982 18.725A7.488 7.488 0 0 0 12 15.75a7.488 7.488 0 0 0-5.982 2.975m11.963 0a9 9 0 1 0-11.963 0m11.963 0A8.966 8.966 0 0 1 12 21a8.966 8.966 0 0 1-5.982-2.275M15 9.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
        </svg>
      </div>
    </div>
  </div>
</header>
