<header class="bg-white shadow-md border-b">
  <div class="w-full px-6 py-4 flex justify-between items-center">
    <h1 (click)="refreshtoDashboard()" class="text-2xl font-bold text-slate-500 cursor-pointer hover:text-slate-700">
      EduSystem
    </h1>
    <div (click)="toggleMenu()" class="cursor-pointer">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
        <path stroke-linecap="round" stroke-linejoin="round" d="M17.982 18.725A7.488 7.488 0 0 0 12 15.75a7.488 7.488 0 0 0-5.982 2.975m11.963 0a9 9 0 1 0-11.963 0m11.963 0A8.966 8.966 0 0 1 12 21a8.966 8.966 0 0 1-5.982-2.275M15 9.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
      </svg>
    </div>

    @if(isMenuOpen()){
      <div class="absolute right-0 top-14 w-52 bg-white rounded-lg shadow-lg overflow-hidden">
        <!-- boton de ver perfil completo -->
        <div  (click)="toggleProfile()" class="flex items-center gap-2 text-slate-500  px-3 py-2 rounded-lg cursor-pointer  transition-all hover:text-slate-700 hover:bg-slate-100">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
          </svg>
          <span >
            Mi perfil
          </span>
        </div>
        <!-- boton cerrar sesion -->
        <div (click)="logout()" class="flex items-center gap-2 text-red-500 rounded-lg px-3 py-2 cursor-pointer transition-all duration-200 hover:bg-red-500 hover:text-white">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15M12 9l-3 3m0 0 3 3m-3-3h12.75" />
          </svg>
          <span>
            Cerrar sesion
          </span>
        </div>
      </div>
      @if(isProfileOpen()){
        <div class="absolute right-56 top-14 w-72 bg-white rounded-xl shadow-xl border p-5">
          <div class="flex flex-col items-center mb-4">
            <div class="w-16 h-16 rounded-full bg-slate-200 flex items-center justify-center">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none"
                  viewBox="0 0 24 24" stroke-width="1.5"
                  stroke="currentColor" class="size-8 text-slate-600">
                <path stroke-linecap="round" stroke-linejoin="round"d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z"/>
              </svg>
            </div>

            <h3 class="mt-3 text-lg font-semibold text-slate-700">
              {{ userInfo[0]?.name }}
            </h3>
          </div>

          <div class="space-y-3 text-sm">
            <p>
              <span class="font-medium text-slate-500">Correo:</span><br>
              {{ userInfo[0]?.email }}
            </p>

            <p>
              <span class="font-medium text-slate-500">Identificación:</span><br>
              {{ userInfo[0]?.identificacion }}
            </p>
          </div>
        </div>

      }
    }
  </div>
</header>
