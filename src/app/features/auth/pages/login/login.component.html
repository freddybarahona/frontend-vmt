<div class="min-h-screen bg-slate-100 flex items-center justify-center p-6">
  <div class="bg-white w-full max-w-6xl rounded-3xl shadow-2xl overflow-hidden flex flex-col lg:flex-row">
    <!-- Panel Izquierdo -->
    <div class="w-full lg:w-1/2 flex items-center justify-center p-8 lg:p-16">
      <div class="w-full max-w-md px-10">
        <!-- Logo -->
        <div class="text-center mb-10">
          <h1 class="text-3xl lg:text-4xl font-bold text-slate-800">
            EduSystem
          </h1>
          <p class="text-slate-500 mt-2 text-sm lg:text-base">
            Inicia sesión para continuar
          </p>
        </div>

        <form (ngSubmit)="login()">

          <!-- Email -->
          <div class="mb-6">
            <label class="block mb-2 text-sm font-semibold text-slate-700">
              Correo electrónico
            </label>
            <div class="relative">
              <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M17.982 18.725A7.488 7.488 0 0 0 12 15.75a7.488 7.488 0 0 0-5.982 2.975m11.963 0a9 9 0 1 0-11.963 0m11.963 0A8.966 8.966 0 0 1 12 21a8.966 8.966 0 0 1-5.982-2.275M15 9.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                  </svg>
                </span>
              <input type="email" [(ngModel)]="email" name="email" placeholder="ejemplo@gmail.com" class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-300 bg-slate-50 focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition">
            </div>

          </div>

          <!-- Password -->
          <div>

            <label class="block mb-2 text-sm font-semibold text-slate-700">
              Contraseña
            </label>

            <div class="relative">

            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">

              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-1.5 0h12a1.5 1.5 0 011.5 1.5v7.5a1.5 1.5 0 01-1.5 1.5h-12A1.5 1.5 0 014.5 19.5v-7.5A1.5 1.5 0 016 10.5z"/>

              </svg>

            </span>

              <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" name="password" placeholder="Ingrese su contraseña" class="w-full pl-10 pr-12 py-3 rounded-xl border border-slate-300 bg-slate-50 focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition">
              <button type="button" (click)="togglePassword()" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 transition">

                @if (!showPassword) {

                  <!-- Ojo abierto -->
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">

                    <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.964-7.178Z" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0Z" />
                  </svg>
                } @else {
                  <!-- Ojo cerrado -->
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
                  </svg>
                }
              </button>
            </div>
          </div>
          @if(loading()){
            <div class="rounded-lg border border-gray-200 bg-white">
              <div class="flex items-center gap-3 px-4 py-3 text-gray-500">

                <svg
                  class="h-5 w-5 animate-spin"
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24">
                  <circle
                    class="opacity-25"
                    cx="12"
                    cy="12"
                    r="10"
                    stroke="currentColor"
                    stroke-width="4">
                  </circle>
                  <path
                    class="opacity-75"
                    fill="currentColor"
                    d="M4 12a8 8 0 018-8v8z">
                  </path>
                </svg>
              </div>
            </div>
          }
          @if (errors_back().includes('Usuario o contrasena incorrectos')) {
              <div class="justify-center">
                <label class="block mb-2 text-red-700 text-sm font-semibold">
                  Usuario o contrasena incorrectos
                </label>
              </div>
            }
          <!-- Botón -->
          <button type="submit" class="w-full mt-8 py-3 rounded-xl bg-blue-600 text-white font-semibold hover:bg-blue-700 transition duration-300 shadow-lg">
            Iniciar Sesión
          </button>
        </form>
        <div>
          <button (click)="reestablecerContrasena()" class="text-slate-500 mt-2 text-sm lg:text-base pl-6">
            Reestablecer contrasena
          </button>
        </div>
      </div>
    </div>
    <!-- Panel Derecho -->
    <div class="hidden lg:flex lg:w-1/2 bg-gradient-to-br from-blue-600 to-indigo-700 text-white flex-col items-center justify-center p-16">
    <div class="w-72 h-72 bg-white/10 rounded-3xl flex items-center justify-center text-2xl font-bold backdrop-blur-sm">
      Dashboard
    </div>
      <h2 class="text-4xl font-bold mt-10 text-center">
        Bienvenido
      </h2>
      <p class="text-center mt-4 text-blue-100 max-w-md leading-relaxed">
        Gestiona estudiantes, materias y actividades
        desde una plataforma moderna diseñada para
        facilitar la administración académica.
      </p>
    </div>
  </div>
</div>
