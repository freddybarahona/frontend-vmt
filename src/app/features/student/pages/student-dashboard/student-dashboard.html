<div class="container mt-5">

  <h1 class="text-center mb-4">
    Dashboard Student
    @if(!loading()){
      <p>Cantidad de materias: {{ subjects.length }}</p>
    }
  </h1>

  <table class="table table-striped table-bordered">

    <thead>
      <tr>
        <th>Materia</th>
        <th>Calificación</th>
      </tr>
    </thead>

    <tbody>
      @if(!loading()){
        @for(subject of subjects; track subject.id){
          <tr>
            <td>{{ subject.name }}</td>
            <td>{{ subject.grade }}</td>
          </tr>
        }
      }

    </tbody>

  </table>

</div>
